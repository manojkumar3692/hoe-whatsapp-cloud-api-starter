# PRIMARY schedule for abandoned-cart reminders (we're on Vercel Hobby,
# which caps cron at once/day with ±59min precision — too coarse for a
# 30-minute abandoned-cart delay). This workflow runs every 30 minutes,
# free, independent of Vercel's plan.
#
# vercel.json still has a once-a-day cron hitting the same endpoint — that
# one is just a backup sweep in case this workflow ever stops running (see
# note below), not the main mechanism. Calling the endpoint twice is
# harmless; it only sends to sessions that haven't been notified yet.
#
# Setup:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: CRON_SECRET   Value: same value as CRON_SECRET in your app's env vars
#   2. Replace YOUR-DOMAIN.com below with your real deployed domain.
#
# Note: GitHub Actions schedules are best-effort, not exact-to-the-minute,
# and get auto-disabled after 60 days with no repo activity — if reminders
# stop going out, check the Actions tab and re-enable it. (vercel.json's
# daily cron will still catch things in the meantime, just slower.)

name: Abandoned Cart Reminders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sS -f -X GET \
            "https://YOUR-DOMAIN.com/api/checkout-sessions/send-abandoned-cart-reminders?delay_minutes=30" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
