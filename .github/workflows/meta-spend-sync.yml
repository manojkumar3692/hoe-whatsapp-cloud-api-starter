name: Meta advertising spend sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    # Opt in after the migration and server-side Meta credentials are configured.
    if: vars.META_SPEND_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh current and previous month
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --fail --max-time 600 \
            "$APP_BASE_URL/api/accounts/meta/sync" \
            -H "Authorization: Bearer $CRON_SECRET"
